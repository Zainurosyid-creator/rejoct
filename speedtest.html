  <style>
    /* Tambahan khusus speedtest biar nyambung sama tema */
    .speed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 20px auto;
    }
    .speed-card {
      background: #222;
      border: 2px solid #444;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      transition: 0.3s;
    }
    .speed-card:hover {
      border-color: #00f8f4; 
    }
    .speed-card h2 {
      color: #00f8f4;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .speed-card .sub {
      color: #888;
      font-size: 12px;
      margin-bottom: 20px;
    }
    .hasil {
      font-size: 42px;
      font-weight: 800;
      color: #00f8f4;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 10px rgba(0,248,244,0.3);
    }
    .btn-speed {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 15px;
      width: 100%;
      transition: 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-speed:hover { background: #0b5ed7; transform: scale(1.02); }
    .btn-speed:disabled { background: #444; transform: none; cursor: not-allowed; }
    .btn-speed.ping { background: #222; border: 1px solid #00f8f4; color: #00f8f4; }
    .loading { color: #facc15; font-size: 13px; margin-top: 12px; min-height: 18px; }
    .rating { font-size: 14px; margin-top: 8px; font-weight: bold; }
  </style>

  <script>
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("show");
      document.getElementById("backdrop").classList.toggle("active");
    }

    // MODE 1: FIX 10MB BENERAN
    async function testProcessing() {
      const btn = document.getElementById('btnProcessing');
      const hasil = document.getElementById('hasil');
      const loading = document.getElementById('loading');
      const rating = document.getElementById('rating');
      
      btn.disabled = true;
      hasil.innerHTML = '0 MB/s';
      rating.innerHTML = '';
      loading.innerHTML = 'Bikin file 10MB di HP lu...';
      
      const start = performance.now();
      try {
        const chunk = new Uint8Array(1024 * 1024);
        for(let i=0;i<chunk.length;i++) chunk[i] = Math.floor(Math.random()*256);
        
        const chunks = Array(10).fill(chunk); // 10MB beneran
        const blob = new Blob(chunks);
        
        await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve();
          reader.readAsArrayBuffer(blob);
        });
        
        const end = performance.now();
        const detik = (end - start) / 1000;
        const sizeMB = blob.size / (1024*1024);
        const speed = (sizeMB / detik).toFixed(2);
        
        hasil.innerHTML = speed + ' MB/s';
        loading.innerHTML = `File: ${sizeMB}MB | ${detik.toFixed(2)} detik`;
        
        let rank = '', color = '#00f8f4';
        if(speed < 50) { rank = 'Rank: Kentang 🥔'; color = '#ff4444'; }
        else if(speed < 150) { rank = 'Rank: Lumayan'; color = '#ffaa00'; }
        else if(speed < 300) { rank = 'Rank: Kenceng 🔥'; color = '#00f8f4'; }
        else { rank = 'Rank: DEWA CPU ⚡'; color = '#00ff41'; }
        rating.innerHTML = rank;
        rating.style.color = color;
        
      } catch(err) {
        hasil.innerHTML = 'Error';
        loading.innerHTML = err.message;
      }
      setTimeout(() => btn.disabled = false, 2000);
    }

    // MODE 2: FIX ANTI CACHE
    async function testPing() {
      const btn = document.getElementById('btnPing');
      const hasil = document.getElementById('hasilPing');
      const loading = document.getElementById('loadingPing');
      const rating = document.getElementById('ratingPing');
      
      btn.disabled = true;
      hasil.innerHTML = '- ms';
      rating.innerHTML = '';
      
      const pingList = [];
      for(let i=0;i<8;i++) {
        const start = performance.now();
        try {
          await fetch('https://www.google.com/favicon.ico?t=' + Date.now() + Math.random(), {
            mode: 'no-cors',
            cache: 'no-store'
          });
          const end = performance.now();
          const p = end - start;
          pingList.push(p);
          loading.innerHTML = `Ping ke-${i+1}: ${p.toFixed(0)}ms`;
        } catch(e) {
          const end = performance.now();
          pingList.push(end - start);
        }
        await new Promise(r => setTimeout(r, 150));
      }
      
      const avg = pingList.reduce((a,b)=>a+b)/pingList.length;
      const jitter = Math.max(...pingList) - Math.min(...pingList);
      
      hasil.innerHTML = avg.toFixed(0) + ' ms';
      loading.innerHTML = `Avg 8x | Jitter: ${jitter.toFixed(0)}ms`;
      
      let rank = '', color = '#00f8f4';
      if(avg < 30) { rank = 'Rank: Fiber Optik 🚀'; color = '#00ff41'; }
      else if(avg < 80) { rank = 'Rank: Kenceng'; color = '#00f8f4'; }
      else if(avg < 150) { rank = 'Rank: Standar'; color = '#ffaa00'; }
      else { rank = 'Rank: Lemot Banget 💀'; color = '#ff4444'; }
      rating.innerHTML = rank;
      rating.style.color = color;
      
      btn.disabled = false;
    }
  </scri>
</body>
</html>
